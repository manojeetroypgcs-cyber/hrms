{% extends 'base.html' %}

{% block title %}Delete Employee - HRMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirm Delete</h4>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete employee
                    <strong>{{ employee.employee_code }} - {{ employee.user.get_full_name }}</strong>?
                </p>
                <p class="text-danger"><small>This action cannot be undone.</small></p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Yes, Delete
                    </button>
                    <a href="{% url 'employee_detail' employee.pk %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
